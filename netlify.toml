[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's maintained Next.js adapter handles App Router, Route Handlers,
# server-side rendering, and image/runtime routing.
[[plugins]]
  package = "@netlify/plugin-nextjs"
